<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markhor Mining Application</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #000; padding-bottom: 80px; position: relative; }
        
        /* Header */
        .top-header { text-align: center; padding: 20px; }
        .main-balance { font-size: 45px; font-weight: bold; color: #ffb703; }
        
        /* Pages */
        .page { display: none; padding: 20px; }
        .active-page { display: block; }

        /* Mining Page */
        .mining-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; }
        .tap-coin-btn { width: 250px; height: 250px; border-radius: 50%; border: 8px solid #ffb703; cursor: pointer; overflow: hidden; background: #111; }
        .tap-coin-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #222; }
        .nav-btn { color: #888; cursor: pointer; font-size: 12px; }
        .nav-btn.active { color: #ffb703; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <div class="main-balance" id="ui-balance">0</div>
    </div>

    <!-- 1. Mining Page -->
    <div id="page-mining" class="page active-page">
        <div class="mining-container">
            <button class="tap-coin-btn" id="tap-btn">
                <!-- یہاں اپنی تصویر کا لنک لگائیں -->
                <img src="https://cdn-icons-png.flaticon.com/512/2488/2488544.png" id="markhor-img">
            </button>
        </div>
    </div>

    <!-- 2. Upgrades Page -->
    <div id="page-upgrades" class="page">
        <h2>Upgrade Cards</h2>
        <p style="color: #666; margin-top: 10px;">مزید کارڈز یہاں دکھائی دیں گے...</p>
    </div>

    <!-- 3. Tasks Page -->
    <div id="page-tasks" class="page">
        <h2>Tasks</h2>
        <p style="color: #666; margin-top: 10px;">ٹاسک اور انعامات یہاں آئیں گے...</p>
    </div>

    <!-- 4. Leaderboard Page -->
    <div id="page-leaderboard" class="page">
        <h2>Leaderboard</h2>
        <p style="color: #666; margin-top: 10px;">ٹاپ مائنرز کی فہرست یہاں ہوگی...</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-btn active" onclick="switchTab('page-mining', this)">Mining</div>
        <div class="nav-btn" onclick="switchTab('page-upgrades', this)">Upgrades</div>
        <div class="nav-btn" onclick="switchTab('page-tasks', this)">Tasks</div>
        <div class="nav-btn" onclick="switchTab('page-leaderboard', this)">Leaderboard</div>
    </div>
</div>

<script>
    let balance = 0;
    const balanceEl = document.getElementById('ui-balance');
    const tapBtn = document.getElementById('tap-btn');

    // ٹیپنگ لاجک
    tapBtn.addEventListener('click', () => {
        balance += 1;
        balanceEl.innerText = balance;
    });

    // نیویگیشن لاجک
    function switchTab(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active-page');
        btn.classList.add('active');
    }
</script>

</body>
</html>
