<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markhor Mining App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #151515;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Header */
        .header {
            padding: 15px;
            text-align: center;
            background: linear-gradient(180deg, #252525, #151515);
        }
        .balance-container {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
            color: #f3ba2f; /* Binance Gold Color */
        }
        /* Main Content Pages */
        .page {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .active-page {
            display: flex;
        }
        /* Mining Page Styles */
        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: url('https://raw.githubusercontent.com/Mkrewardbot/Markhor/main/logo.png') no-repeat center; /* Aapka Logo */
            background-size: cover;
            border: 8px solid #f3ba2f;
            box-shadow: 0 0 30px #f3ba2f;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .coin-btn:active {
            transform: scale(0.95);
        }
        .energy-container {
            margin-top: 30px;
            width: 80%;
            max-width: 300px;
        }
        .energy-text {
            font-size: 16px;
            margin-bottom: 5px;
            text-align: left;
        }
        .energy-bar {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
        }
        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f3ba2f, #ffea79);
            transition: width 0.1s ease;
        }
        /* Task & Ref Styles */
        .task-list, .ref-container {
            width: 100%;
            max-width: 400px;
        }
        .task-item {
            background-color: #222;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .task-btn {
            background-color: #f3ba2f;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Bottom Navigation Bar */
        .nav-bar {
            height: 70px;
            background-color: #202020;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #333;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            font-size: 12px;
        }
        .nav-item.active {
            color: #f3ba2f;
        }
        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Markhor Token</h2>
        <div class="balance-container" id="balance">0</div>
    </div>

    <div id="page-mining" class="page active-page">
        <div class="coin-btn" id="coinBtn"></div>
        <div class="energy-container">
            <div class="energy-text" id="energyText">1000 / 1000</div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <div id="page-tasks" class="page">
        <h3 style="margin-bottom: 20px;">Tasks List</h3>
        <div class="task-list">
            <div class="task-item">
                <div>
                    <p style="font-weight: bold;">Join Telegram Channel</p>
                    <p style="font-size: 12px; color: #aaa;">+50,000 MK</p>
                </div>
                <button class="task-btn" onclick="doTask('https://t.me/Mkrewardbot', 50000)">Join</button>
            </div>
            <div class="task-item">
                <div>
                    <p style="font-weight: bold;">Subscribe YouTube</p>
                    <p style="font-size: 12px; color: #aaa;">+30,000 MK</p>
                </div>
                <button class="task-btn" onclick="doTask('https://youtube.com', 30000)">Watch</button>
            </div>
        </div>
    </div>

    <div id="page-refs" class="page">
        <h3>Invite Friends</h3>
        <p style="color: #aaa; text-align: center; margin: 15px 0;">Share your link and earn +25,000 for each friend!</p>
        <div class="ref-container">
            <div class="task-item">
                <input type="text" id="refLink" value="Loading link..." readonly style="background: transparent; color: #fff; border: none; width: 70%;">
                <button class="task-btn" onclick="copyRef()">Copy</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('mining')">
            <div class="nav-icon">⛏️</div>
            <div>Mining</div>
        </div>
        <div class="nav-item" onclick="switchPage('tasks')">
            <div class="nav-icon">📋</div>
            <div>Tasks</div>
        </div>
        <div class="nav-item" onclick="switchPage('refs')">
            <div class="nav-icon">👥</div>
            <div>Friends</div>
        </div>
    </div>

    <script>
        // Telegram Web App Full Screen Trigger
        const tg = window.Telegram.WebApp;
        tg.expand(); // Is se app full screen ho jayega

        // Page Switching Logic
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            if(pageId === 'mining') {
                document.getElementById('page-mining').classList.add('active-page');
                event.currentTarget.classList.add('active');
            } else if(pageId === 'tasks') {
                document.getElementById('page-tasks').classList.add('active-page');
                event.currentTarget.classList.add('active');
            } else if(pageId === 'refs') {
                document.getElementById('page-refs').classList.add('active-page');
                event.currentTarget.classList.add('active');
            }
        }

        // Basic placeholder functions for Tasks & Copy
        function doTask(url, reward) {
            window.open(url, '_blank');
            // Agle step mein isko Firebase se connect karenge reward dene ke liye
        }

        function copyRef() {
            alert("Link copied!");
        }
    </script>
</body>
</html>
