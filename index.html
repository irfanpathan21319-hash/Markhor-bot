<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markhor Kombat</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #000; position: relative; }
        
        /* Stats Header */
        .stats-header { text-align: center; padding: 30px 20px; }
        .balance { font-size: 48px; font-weight: bold; color: #ffb703; }
        .profit { color: #888; font-size: 14px; margin-top: 5px; }

        /* Mining Section */
        .mining-area { display: flex; justify-content: center; padding: 40px 0; }
        .coin-btn { width: 260px; height: 260px; border-radius: 50%; border: 10px solid #ffb703; 
                    background: #111; cursor: pointer; display: flex; align-items: center; justify-content: center;
                    transition: transform 0.1s; overflow: hidden; }
        .coin-btn:active { transform: scale(0.95); }
        .coin-btn img { width: 90%; height: 90%; object-fit: cover; border-radius: 50%; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #111; 
                   display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #ffb703; }
        
        .page { display: none; }
        .active-page { display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="stats-header">
        <div class="balance" id="balance">12,500</div>
        <div class="profit">Profit per hour: +1,200</div>
    </div>

    <!-- Mining Page -->
    <div id="page-mine" class="page active-page">
        <div class="mining-area">
            <div class="coin-btn" id="coin">
                <!-- یہاں اپنی تصویر کا لنک لگائیں -->
                <img src="https://cdn-icons-png.flaticon.com/512/2488/2488544.png" id="markhor-img">
            </div>
        </div>
    </div>

    <!-- Placeholder Pages -->
    <div id="page-upgrades" class="page" style="padding: 20px;"><h2>Upgrade Cards</h2></div>
    <div id="page-tasks" class="page" style="padding: 20px;"><h2>Earn Tasks</h2></div>

    <!-- Navigation -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('page-mine', this)">Mine</div>
        <div class="nav-item" onclick="switchPage('page-upgrades', this)">Upgrades</div>
        <div class="nav-item" onclick="switchPage('page-tasks', this)">Tasks</div>
    </div>
</div>

<script>
    let balance = 12500;
    const balanceEl = document.getElementById('balance');
    const coin = document.getElementById('coin');

    coin.addEventListener('click', () => {
        balance += 1;
        balanceEl.innerText = balance.toLocaleString();
    });

    function switchPage(pageId, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(pageId).classList.add('active-page');
        element.classList.add('active');
    }
</script>

</body>
</html>
